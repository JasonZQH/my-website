name: CI

# Quality gate. Runs on every PR into dev or main, and on direct pushes to dev.
# Must pass before a PR can be merged (set this as a required check in
# GitHub → Settings → Branches → branch protection for dev and main).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: personal-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The app's db helper reads MONGODB_URI at module load, so the build
          # needs it set. The build's own DB connection attempt fails harmlessly
          # from GitHub's runners (their IPs aren't allowlisted in Atlas) and
          # does not fail the build. The real value is only ever used at runtime
          # from the server's own .env — never baked into the build output.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # Public GA id, inlined at build time (NEXT_PUBLIC_*).
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

  elements-verify:
    name: Elements verify (headless render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: personal-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Render checks (start prod server + drive a headless browser)
        run: npm run test:e2e
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
