name: Deploy to production

# Continuous deployment. Fires when something lands on main (i.e. a merged PR).
# Builds on the GitHub runner (plenty of RAM — the Lightsail box only has 512 MB
# and would OOM), then ships the built app to the server and reloads it with PM2.
on:
  push:
    branches: [main]

# Never run two production deploys at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 44.224.103.100
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /home/ubuntu/apps/personal

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: personal-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship build to server, reload, and health-check
        run: |
          # Ship source + the freshly built .next. Exclude:
          #  - node_modules: reinstalled on the server for its own arch
          #  - .env: the server keeps its own (holds the real MONGODB_URI); --delete
          #          won't touch excluded paths
          #  - /server: the retired top-level Express app. MUST be anchored with a
          #    leading slash — an unanchored 'server' also matches .next/server, which
          #    left the SSR build stale while chunks updated (HTML -> 404 JS chunks).
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='/server' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          # On the server: install prod deps, graceful reload, then run the post-deploy
          # health check — it confirms the app serves AND every JS chunk the HTML
          # references actually resolves (catches an inconsistent .next like the one
          # the unanchored exclude used to produce).
          #
          # Notes on not hanging the job:
          #  - `pm2 reload ... >/dev/null 2>&1`: pm2 over SSH otherwise leaves the
          #    session's stdout/stderr held open by the daemon, so ssh never returns.
          #  - ServerAlive*: drop a genuinely dead connection instead of waiting forever.
          #  - `timeout 420`: hard backstop so a stuck session fails the step in minutes
          #    rather than hanging for the 6h job default.
          timeout 420 ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/ubuntu/apps/personal && npm ci --omit=dev && pm2 reload personal-website >/dev/null 2>&1 && bash scripts/post-deploy-healthcheck.sh'
